<h2 style="color: #01466a;">Murid lelaki</h2>
<p style="color: #003e60;">- Perlu memotong rambut mengikut potongan 1,2,3 bulat,tanpa cukuran.</p>
<p style="color: #003e60;">- Pakaian perlu mengikut jadual dan peraturan sekolah dengan kemas.</p>
<p style="color: #003e60;">- Murid lelaki perlu selitkan baju dalam seluar agar tidak terlihat berserabut.</p>
